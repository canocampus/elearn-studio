# Grafana dashboard provisioning for eLearn Studio (dev)
# Tells Grafana where to find JSON dashboard files.

apiVersion: 1

providers:
  - name: elearn-studio
    orgId: 1
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards
      foldersFromFilesStructure: false
