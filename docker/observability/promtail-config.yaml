# Promtail configuration for eLearn Studio (dev)
#
# Scrapes all Docker container stdout/stderr via the Docker socket.
# Labels each log line with container_name and service.
# Parses Pino JSON output so structured fields (level, msg, err) are
# promoted to Loki stream labels for fast filtering.

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker-containers
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          # Only collect logs from containers with a "com.docker.compose.service" label
          # (i.e., containers started by docker-compose). Prevents picking up ad-hoc containers.
          - name: label
            values: ["com.docker.compose.service"]

    relabel_configs:
      # Use Docker container name as the "container_name" label
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: container_name

      # Expose the compose service name as "service"
      - source_labels: ["__meta_docker_container_label_com_docker_compose_service"]
        target_label: service

      # Expose the compose project name as "project"
      - source_labels: ["__meta_docker_container_label_com_docker_compose_project"]
        target_label: project

    pipeline_stages:
      # 1. Try to parse the line as JSON (Pino format)
      - json:
          expressions:
            level: level
            msg: msg
            err_message: err.message
            req_method: req.method
            req_url: req.url
            res_status: res.statusCode
            response_time: responseTime
            source: source

      # 2. Promote the Pino level to a Loki stream label for efficient level filtering
      - labels:
          level:
          source:

      # 3. Drop excessively verbose trace-level logs in dev to avoid Loki storage pressure
      - drop:
          source: level
          expression: "trace"
