<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Preview — eLearn Studio</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #111;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Inter, system-ui, sans-serif;
    }
    #player {
      width: 1024px;
      height: 768px;
      background: #fff;
      position: relative;
      overflow: hidden;
    }
    .preview-error {
      color: #f38ba8;
      font-size: 14px;
      padding: 20px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div id="player"></div>
  <script src="/player.js"></script>
  <script>
    // T641.1: receive course data from the authoring-ui opener via postMessage.
    // No localStorage — all state transport is in-memory across the same origin.
    (function () {
      var origin = window.location.origin

      function showError(msg) {
        document.getElementById('player').innerHTML =
          '<p class="preview-error">' + msg + '</p>'
      }

      function onData(e) {
        if (e.origin !== origin) return
        if (!e.data || e.data.type !== 'elearn-preview-data') return
        window.removeEventListener('message', onData)

        if (typeof ELearnPlayer === 'undefined' || typeof ELearnPlayer.init !== 'function') {
          showError('Runtime player not loaded. Run: pnpm --filter runtime-player build')
          return
        }
        ELearnPlayer.init('player', e.data.course, { startSlide: e.data.slideIndex || 0 })
      }

      window.addEventListener('message', onData)

      // Signal the opener that we are ready to receive the course data.
      // opener is null when the page is navigated to directly (no popup context).
      if (window.opener) {
        window.opener.postMessage('elearn-preview-ready', origin)
      } else {
        showError('Open Preview from the eLearn Studio editor.')
      }
    })()
  </script>
</body>
</html>
